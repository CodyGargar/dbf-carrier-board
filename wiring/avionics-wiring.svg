" stroke-linejoin="round"/><path d="M870 960.0 L926 960.0" fill="none" stroke="#C2572B" stroke-width="8" marker-end="url(#a_C2572B)" stroke-linejoin="round"/><path d="M1300 960.0 L1366 960.0" fill="none" stroke="#C2572B" stroke-width="8" marker-end="url(#a_C2572B)" stroke-linejoin="round"/><text x="60" y="170" font-size="20" fill="#2E7D52" text-anchor="start" font-weight="700">RECEIVER SIDE: separate receiver battery</text><rect x="60" y="530" width="250" height="100" rx="14" fill="#FFFFFF" stroke="#2E7D52" stroke-width="3"/><text x="185.0" y="569.375" font-size="24" font-weight="700" fill="#10241A" text-anchor="middle" dominant-baseline="central">Receiver battery</text><text x="185.0" y="590.975" font-size="17" fill="#45524A" text-anchor="middle" dominant-baseline="central">2S LiPo 7.4 V, 1300 mAh</text><rect x="60" y="700" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#2E7D52" stroke-width="3"/><text x="185.0" y="744.375" font-size="24" font-weight="700" fill="#10241A" text-anchor="middle" dominant-baseline="central">External radio switch</text><text x="185.0" y="765.975" font-size="17" fill="#45524A" text-anchor="middle" dominant-baseline="central">on the fuselage skin</text><path d="M185 630 L185 696" fill="none" stroke="#2E7D52" stroke-width="7" marker-end="url(#a_2E7D52)" stroke-linejoin="round"/><rect x="60" y="195" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#8A6418" stroke-width="3"/><text x="185.0" y="228.75" font-size="24" font-weight="700" fill="#10241A" text-anchor="middle" dominant-baseline="central">Pilot’s radio</text><text x="185.0" y="250.35" font-size="17" fill="#45524A" text-anchor="middle" dominant-baseline="central">EdgeTX, ELRS 2.4 GHz</text><text x="185.0" y="271.6" font-size="17" fill="#45524A" text-anchor="middle" dominant-baseline="central">shows telemetry + alarms</text><rect x="60" y="360" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#6A756E" stroke-width="3"/><text x="185.0" y="393.75" font-size="24" fon